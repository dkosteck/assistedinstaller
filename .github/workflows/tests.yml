# GitHub Actions workflow for assistedinstaller testing
# assisted-by: Claude 3.5 Sonnet (Cursor)
name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/unit/requirements.txt
    
    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=plugins/modules --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  ansible-sanity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Ansible
      run: |
        python -m pip install --upgrade pip
        pip install ansible-core
    
    - name: Run ansible-test sanity
      run: |
        ansible-test sanity --docker
      continue-on-error: true  # Allow this to fail for now

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint
    
    - name: Run flake8
      run: |
        flake8 plugins/ tests/ --max-line-length=120 --ignore=E501,W503
      continue-on-error: true
    
    - name: Run pylint
      run: |
        pylint plugins/modules/*.py --disable=C0111,C0103,R0903
      continue-on-error: true
